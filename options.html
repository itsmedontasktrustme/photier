<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gemini Page Evaluator settings</title>
  <style>
    body { max-width: 760px; margin: 48px auto; padding: 0 24px; color: #111827; font: 15px/1.5 system-ui, sans-serif; }
    h1 { font-size: 24px; } label { display: block; margin-top: 18px; font-weight: 650; }
    input, textarea { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; }
    textarea { min-height: 130px; resize: vertical; } button { margin-top: 18px; padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
    #status { display: inline-block; margin-left: 12px; color: #166534; }
  </style>
</head>
<body>
  <h1>Gemini Page Evaluator</h1>
  <p>Get an API key from Google AI Studio, then choose a Gemini model and evaluation prompt.</p>
  <label>Gemini API key<input id="apiKey" type="password" autocomplete="off" placeholder="AIza…"></label>
  <label>Model<input id="model" value="gemini-4-hydrogen" placeholder="gemini-4-hydrogen"></label>
  <label>Evaluation prompt<textarea id="prompt"></textarea></label>
  <button id="save" type="button">Save settings</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
